name: "Blaze Models Prefill tests"

on:
  workflow_dispatch:
    inputs:
      test-type:
        # Authoritative list of valid tokens lives in the test matrix
        # (tests/pipeline_reorg/blaze_models_prefill_tests.yaml) and is enforced
        # by the validate-test-type job below. This text is just UX help.
        description: >-
          Comma-separated stages to run, e.g. "mla_chunked,glm_moe,kimi_moe".
          Empty or "all" runs every stage. Groups: "module" runs every stage,
          "sdpa_perf" runs ring-joint SDPA and high-bandwidth all-gather,
          "runner_kv" runs the disaggregated-prefill runner+producer legs on SC1 and SC4.
          Valid stages: dsa_mla_glm, glm_chunked, glm_chunked_accuracy, glm_moe, glm_prefill_block, hca_chunked, hca_perf, high_bw_all_gather_perf, k3_mla, k3_mla_perf, k3_mla_trace, kimi_chunked, kimi_chunked_padded, kimi_dflash, kimi_k3_moe, kimi_moe, kimi_moe_perf, kv_cache_table, minimax_prefill_kv_pcc, minimax_prefill_perf, mla_chunked, moe_gate, prefill_block_determinism, prefill_runner, prefill_runner_kv_pcc, prefill_transformer_determinism, ring_joint_sdpa_perf.
          Tags (each runs every matching stage): block, ccl, determinism, dflash, dsv4_flash, gate, glm_5_2, hca, kimi_k2_6, kimi_k2_7, kimi_k3, kv_cache, minimax_m3, mla, moe, runner, sdpa, transformer.
        required: false
        type: string
        default: "all"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
  schedule:
    - cron: "0 5 * * *" # Run at 5:00 AM UTC every day

jobs:
  validate-test-type:
    # Fail fast on a bad selection before spending a build on it. Emits the
    # normalized selection (empty/"all" -> "all") consumed by the impl filter.
    runs-on: ubuntu-slim
    outputs:
      test-type: ${{ steps.validate.outputs.selection }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/blaze_models_prefill_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Validate test-type selection
        id: validate
        # Pass the user input via env (not direct ${{ }} interpolation) to avoid
        # shell injection from the workflow_dispatch input.
        env:
          TEST_TYPE: ${{ inputs.test-type }}
        run: |
          python3 .github/scripts/utils/validate_test_type_selection.py \
            "${{ env.TESTS_YAML_PATH }}" \
            "${TEST_TYPE}"

  check-harbor:
    needs: validate-test-type
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: [validate-test-type, check-harbor]
    if: ${{ !cancelled() && needs.validate-test-type.result == 'success' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      build-wheel: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  Galaxy-Blaze-models-prefill:
    needs: [validate-test-type, check-harbor, build-artifact]
    # Skip when only a focused-job stage was requested: sdpa_perf and the runner legs each have
    # their own impl invocation, so firing this caller for them leaves an empty matrix once its
    # exclusions are applied. "all"/"module" still select this job.
    if: ${{ needs.validate-test-type.outputs.test-type != 'sdpa_perf'
      && needs.validate-test-type.outputs.test-type != 'prefill_runner_kv_pcc'
      && needs.validate-test-type.outputs.test-type != 'runner_kv' }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc1,bh_sc1_high_power
      sp-config: sc1
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      # Keep the perf checks in a focused job so the long functional run remains unchanged.
      # runner_kv is excluded here rather than left to sp_config: it has sc1 entries now, and its
      # idling runner needs hang detection off -- a per-job input this invocation does not carry.
      exclude-test-group: sdpa_perf,runner_kv
      resource-prefix: module

  Galaxy-Blaze-models-prefill-SDPA-Perf-tests:
    needs: [validate-test-type, check-harbor, build-artifact]
    # Runs for the default "all", for the sdpa_perf group, and for any token that selects one of
    # its entries -- their test_types and tags land here and nowhere else, so a caller that ignored
    # them would leave those selections with nothing to run.
    if: ${{ needs.validate-test-type.outputs.test-type == 'all'
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',sdpa_perf,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',ring_joint_sdpa_perf,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',high_bw_all_gather_perf,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',sdpa,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',ccl,') }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc1,bh_sc1_high_power
      sp-config: sc1
      # Pinned to the group rather than passed through: the selection that fired this caller may be
      # a tag shared with legs that belong to the module job.
      test-type: sdpa_perf
      resource-prefix: sdpa-perf

  Galaxy-Blaze-models-prefill-sc4:
    needs: [validate-test-type, check-harbor, build-artifact]
    # 4-galaxy (SC4) half of the disaggregated-prefill runner+producer KV-PCC pair; the sc1 caller
    # below is the other half. Each supercluster needs its own impl invocation because the impl
    # filters the matrix by sp_config, and both need hang detection off, which is a per-job input.
    # Tokens that can select a runner entry: its test_type, its test_group, or any of its test_tags
    # (kimi_k2_7 / glm_5_2 / runner / kv_cache). Firing this caller for a selection with no sc4
    # entry fails on an empty matrix, so the list stays exact. "module" is deliberately absent:
    # these legs own a supercluster for the better part of an hour and are not module-level work.
    #
    # Each token is comma-wrapped on BOTH sides because contains() is substring-based while the
    # impl's filter matches whole tokens. Without the wrapping, `kv_cache_table` (sc1-only)
    # satisfies contains(..., 'kv_cache') and fires this caller, whose filter then finds no sc4
    # entry and fails the run -- which is exactly what happened on run 33065088619. The validator
    # emits the selection as ",".join(tokens) with no spaces, so ',<token>,' is an exact match.
    if: ${{ needs.validate-test-type.outputs.test-type == 'all'
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',runner_kv,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',prefill_runner_kv_pcc,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',kimi_k2_7,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',glm_5_2,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',runner,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',kv_cache,') }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc4
      sp-config: sc4
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      resource-prefix: sc4
      # The runner is a server that idles in an unbounded request loop until the producer
      # connects and drives H2D, so no device op completes for tens of seconds by design.
      # The default operation-timeout watchdog would fire mid-idle, run tt-triage (which
      # halts the cores) and wedge the fabric; disable it so the leg matches demo-sp, which
      # never armed the watchdog.
      hang-detection-timeout: 0

  Galaxy-Blaze-models-prefill-sc1-runner:
    needs: [validate-test-type, check-harbor, build-artifact]
    # Single-galaxy (SC1) half of the runner+producer KV-PCC pair. Separate from the sc1 module
    # caller above -- not because of sp_config, which they share, but because the idling runner
    # needs hang detection off and that is a per-job input. The module caller therefore excludes
    # runner_kv, and the two never both claim a runner leg.
    # Selection tokens mirror the sc4 caller exactly; see its comment for the comma-wrapping.
    if: ${{ needs.validate-test-type.outputs.test-type == 'all'
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',runner_kv,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',prefill_runner_kv_pcc,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',kimi_k2_7,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',glm_5_2,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',runner,')
      || contains(format(',{0},', needs.validate-test-type.outputs.test-type), ',kv_cache,') }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      # Base pool only: the runner legs are long enough that the high-power pool would starve
      # the shorter sc1 module legs that share it.
      enabled-skus: bh_sc1
      sp-config: sc1
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      # sp_config cannot isolate this caller from the sc1 module caller above -- they share it --
      # so the group is named here. Selection still narrows within it: a kimi_k2_7 dispatch runs
      # the Kimi leg alone, not both.
      include-test-group: runner_kv
      resource-prefix: sc1-runner
      # Same reason as the sc4 caller: the runner idles by design and the watchdog would
      # triage a healthy run into a wedged fabric.
      hang-detection-timeout: 0

  ai-run-summary:
    name: "AI Run Summary"
    # One run-level summary across both test groups. Each impl invocation
    # uploads its leg matrix as test_matrix_<resource-prefix>; we merge them
    # into expected-jobs so legs that produced no ai_job_summary artifact are
    # reconciled as infra failures rather than silently dropped.
    needs: [Galaxy-Blaze-models-prefill, Galaxy-Blaze-models-prefill-SDPA-Perf-tests,
      Galaxy-Blaze-models-prefill-sc4, Galaxy-Blaze-models-prefill-sc1-runner]
    # Reports on a run that failed — the case the summary exists for — but not
    # on one that was cancelled: an aborted run has no outcome to summarize, and
    # asking for one spends an LLM call to say it stopped early.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Download per-group matrices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test_matrix_*
          path: matrices
          merge-multiple: true
        continue-on-error: true
      - name: Merge matrices into expected-jobs union
        id: merge
        run: |
          if compgen -G "matrices/test_matrix_*.json" > /dev/null; then
            merged=$(jq -cs 'add // []' matrices/test_matrix_*.json)
          else
            merged='[]'
          fi
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$merged" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Aggregate upstream run result
        id: run-result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          RESULT=$(jq -rn --argjson n "$NEEDS" '
            [$n[].result] as $r |
            if   any($r[]; . == "failure")   then "failure"
            elif any($r[]; . == "cancelled") then "cancelled"
            elif any($r[]; . == "success")   then "success"
            else                                  "skipped"
            end')
          echo "run-result=$RESULT" >> "$GITHUB_OUTPUT"
      - id: ai-run-summary
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/run@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "$GITHUB_WORKSPACE",
              "input_dir": "ai_job_summaries",
              "output_dir": "ai_run_summaries"
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          expected-jobs: ${{ steps.merge.outputs.matrix }}
          run-result: ${{ steps.run-result.outputs.run-result }}
      - name: Show report
        if: always() && steps.ai-run-summary.outputs.report-file != ''
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.ai-run-summary.outputs.report-file }}
        run: |
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Report file not found: $REPORT_FILE"
          fi
